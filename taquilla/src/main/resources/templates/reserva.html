<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reserva</title>
</head>
<body>
<form action="/reserva" method="post">
    <label for="eventoId">Obra:</label>
    <select name="eventoId" id="eventoId">
        <option value="101">Casa de Bernarda Alba</option>
        <option value="102">Yerma</option>
        <option value="103">El Tragaluz</option>
    </select><br>
    <label for="nombreCliente">Nombre Cliente:</label>
    <input type="text" name="nombreCliente" id="nombreCliente" required><br>
    <label for="tipoEntrada">Zona:</label>
    <select name="tipoEntrada" id="tipoEntrada" required>
        <option value="GENERAL">General</option>
        <option value="VIP">VIP</option>
    </select><br>
    <label for="entradas">Entradas:</label>
    <input type="number" name="entradas" id="entradas" required><br>
    <label for="cupon">Cupon de Descuento:</label>
    <input type="text" name="cupon" id="cupon"><br>
    <input type="submit" value="Reservar">
</form>
</body>
</html>
