<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prestamo</title>
</head>
<body>
<form action="/prestamo" method="post">
    <label>Libro ID</label>
    <input type="number" name="libroId" id="libroId"><br>
    <label>Nombre Socio</label>
    <input type="text" name="nombreSocio" id="nombreSocio"><br>
    <label>Dias de Prestamo</label>
    <input type="number" name="diasPrestamo" id="diasPrestamo"><br>
    <label>Carnet Premium</label>
    <input type="radio" name="carnetPremium" id="true">Si
    <input type="radio" name="carnetPremium" id="false">No<br>
    <input type="submit">
</form>

</body>
</html>
